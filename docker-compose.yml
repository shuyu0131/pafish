# pafish 博客 CMS —— 完全容器化编排（MySQL + 应用）
#
# 用法：docker compose up -d --build    一条命令起全部（首次自动迁移/索引/种子）
# 端口可用环境变量覆盖：MYSQL_PORT（默认 3307）、APP_PORT（默认 3000）
#
# 数据持久化（命名卷，删容器/重建不丢）：
#   pafish-mysql-data  MySQL 数据
#   pafish-uploads     上传媒体（本地回退，云存储插件启用后不落盘）
#   pafish-themes      主题（商店安装/主题管理写入）
#   pafish-plugins     插件（商店安装写入）
#   pafish-backups     后台数据备份文件
#
# 注意：旧混合模式的 docker run 容器 pafish-mysql（无卷）与此编排互不冲突；
#       旧容器如需持久化请按 README「升级已有容器到持久化」迁移。

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: pafish_root_2026
      MYSQL_DATABASE: pafish
      MYSQL_USER: pafish
      MYSQL_PASSWORD: pafish_pass
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - pafish-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppafish_root_2026"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  app:
    build:
      context: .
      args:
        # 国内网络构建加速：在 .env 中配置 NPM_REGISTRY=https://registry.npmmirror.com
        npm_config_registry: "${NPM_REGISTRY:-}"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # 容器内固定走 compose 网络的服务名 mysql，不受宿主 .env 的 DATABASE_URL 影响
      DATABASE_URL: "mysql://pafish:pafish_pass@mysql:3306/pafish"
      # 以下从项目根 .env 读取（compose 自动加载 .env 插值），未配置则用示例默认值
      AUTH_SECRET: "${AUTH_SECRET:-pafish-secret-2026-change-me}"
      SITE_URL: "${SITE_URL:-http://localhost:3000}"
      # 邮件 SMTP 兜底（可选，后台站点设置优先）
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      # 后台「数据备份/恢复」功能：容器内连接 MySQL 的地址
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_NAME: "pafish"
      DB_ROOT_USER: "root"
      DB_ROOT_PASSWORD: "pafish_root_2026"
    volumes:
      - pafish-uploads:/app/public/uploads
      - pafish-themes:/app/themes
      - pafish-plugins:/app/plugins
      - pafish-backups:/app/backups

volumes:
  pafish-mysql-data:
  pafish-uploads:
  pafish-themes:
  pafish-plugins:
  pafish-backups:
